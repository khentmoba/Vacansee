name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Analysis
        run: flutter analyze

      - name: Build Flutter Web (base-href /app/)
        run: flutter build web --release --base-href /app/

      - name: Relocate Flutter output to build/web/app/
        run: |
          mkdir -p /tmp/flutter-out
          cp -r build/web/. /tmp/flutter-out/
          rm -rf build/web
          mkdir -p build/web/app
          cp -r /tmp/flutter-out/. build/web/app/

      - name: Install React landing dependencies
        run: cd landing && npm ci

      - name: Build React Landing Page
        run: cd landing && npm run build

      - name: Copy React output to build/web root
        run: |
          cp landing/dist/index.html build/web/index.html
          cp -r landing/dist/assets/. build/web/assets/
          mkdir -p build/web/images
          cp -r landing/public/images/. build/web/images/
          cp landing/public/favicon.png build/web/favicon.png

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          cp vercel.json build/web/
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy build/web --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
          else
            vercel deploy build/web --token=${{ secrets.VERCEL_TOKEN }} --yes
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
